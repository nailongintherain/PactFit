:root{
  --bg:#F5F3EF; --card:#FFFFFF; --ink:#25231F; --ink2:#8C867D; --ink3:#BDB7AD;
  --line:#EEEAE3; --fill:#F5F2ED;
  --her:#D98B72; --her-soft:#F8ECE6;
  --him:#6F8CB8; --him-soft:#EAEFF7;
  --good:#7FAE92; --good-soft:#E9F1EC; --good-ink:#4E8168;
  --danger:#C1796A; --danger-soft:#F5EDEA;
}

/* ---------- 成员配色：按加入顺序分配，最多 6 人 ---------- */
.av.c0{background:#F8ECE6;color:#D98B72;}
.bar-name.c0{color:#D98B72;}
.bar-pct.c0{color:#D98B72;}
.bar i.c0{background:#D98B72;}
.dot.c0{background:#D98B72;}
.lg.c0{background:#D98B72;}
.tl-dot.c0{background:#D98B72;box-shadow:0 0 0 3px #F8ECE6;}
.rw-who.c0{background:#F8ECE6;color:#D98B72;}
.av.c1{background:#EAEFF7;color:#6F8CB8;}
.bar-name.c1{color:#6F8CB8;}
.bar-pct.c1{color:#6F8CB8;}
.bar i.c1{background:#6F8CB8;}
.dot.c1{background:#6F8CB8;}
.lg.c1{background:#6F8CB8;}
.tl-dot.c1{background:#6F8CB8;box-shadow:0 0 0 3px #EAEFF7;}
.rw-who.c1{background:#EAEFF7;color:#6F8CB8;}
.av.c2{background:#E9F1EC;color:#7FAE92;}
.bar-name.c2{color:#7FAE92;}
.bar-pct.c2{color:#7FAE92;}
.bar i.c2{background:#7FAE92;}
.dot.c2{background:#7FAE92;}
.lg.c2{background:#7FAE92;}
.tl-dot.c2{background:#7FAE92;box-shadow:0 0 0 3px #E9F1EC;}
.rw-who.c2{background:#E9F1EC;color:#7FAE92;}
.av.c3{background:#F2EDF7;color:#A98BC4;}
.bar-name.c3{color:#A98BC4;}
.bar-pct.c3{color:#A98BC4;}
.bar i.c3{background:#A98BC4;}
.dot.c3{background:#A98BC4;}
.lg.c3{background:#A98BC4;}
.tl-dot.c3{background:#A98BC4;box-shadow:0 0 0 3px #F2EDF7;}
.rw-who.c3{background:#F2EDF7;color:#A98BC4;}
.av.c4{background:#FAF3E2;color:#C9A227;}
.bar-name.c4{color:#C9A227;}
.bar-pct.c4{color:#C9A227;}
.bar i.c4{background:#C9A227;}
.dot.c4{background:#C9A227;}
.lg.c4{background:#C9A227;}
.tl-dot.c4{background:#C9A227;box-shadow:0 0 0 3px #FAF3E2;}
.rw-who.c4{background:#FAF3E2;color:#C9A227;}
.av.c5{background:#E8F2F1;color:#6FA6A0;}
.bar-name.c5{color:#6FA6A0;}
.bar-pct.c5{color:#6FA6A0;}
.bar i.c5{background:#6FA6A0;}
.dot.c5{background:#6FA6A0;}
.lg.c5{background:#6FA6A0;}
.tl-dot.c5{background:#6FA6A0;box-shadow:0 0 0 3px #E8F2F1;}
.rw-who.c5{background:#E8F2F1;color:#6FA6A0;}
/* ---------- 多空间 ---------- */
.space-item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);}
.space-item:first-child{padding-top:0;}
.space-item:last-child{border-bottom:none;padding-bottom:0;}
.space-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.space-name{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.space-meta{font-size:10px;color:var(--ink3);font-weight:400;margin-top:3px;overflow:hidden;text-overflow:ellipsis;}
.space-cur{font-size:10px;font-weight:700;color:var(--good-ink);background:var(--good-soft);padding:3px 7px;border-radius:6px;flex:none;}
.space-go{font-size:11px;color:var(--ink2);flex:none;}
.msg-who{font-size:10px;color:var(--ink3);margin:0 0 4px 3px;}
.back-link{font-size:12px;color:var(--ink2);margin-bottom:16px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
}
button,input,textarea,select{font-family:inherit;color:inherit;}
button{border:none;background:none;cursor:pointer;}
.hidden{display:none !important;}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px;text-align:center;}

/* ---------- 登录 / 配对 ---------- */
.brand-icon{width:78px;height:78px;border-radius:22px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin-bottom:22px;
  box-shadow:0 12px 28px -14px rgba(45,38,28,.22);}
.brand-icon svg{width:40px;height:40px;}
h1.brand{font-size:25px;font-weight:700;letter-spacing:-.02em;}
.sub{font-size:13px;color:var(--ink2);margin-top:9px;line-height:1.65;}
.form{width:100%;max-width:340px;margin-top:30px;text-align:left;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;color:var(--ink2);margin-bottom:7px;letter-spacing:.03em;}
.input,.select{
  width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:#fff;
  padding:0 15px;font-size:15px;outline:none;appearance:none;
}
.input:focus{border-color:#D6D0C6;}
.input.err{border-color:#E3B5A8;background:#FDF7F5;}
.input::placeholder{color:var(--ink3);}
textarea.input{height:84px;padding:13px 15px;line-height:1.6;resize:none;font-size:14px;}
.row2{display:flex;gap:10px;}
.row2 > *{flex:1;}
.code-row{display:flex;gap:10px;}
.code-row .input{flex:1;width:auto;min-width:0;}
.btn{width:100%;height:52px;border-radius:16px;background:var(--ink);color:#fff;font-size:15px;
  font-weight:600;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;}
.btn:disabled{opacity:.4;}
.btn.sm{height:48px;font-size:14px;border-radius:14px;}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
.btn.bit{height:50px;padding:0 18px;border-radius:14px;background:var(--fill);color:var(--ink2);font-size:14px;font-weight:500;flex:none;width:auto;}
.btn.bit:disabled{opacity:.5;}
.link{font-size:12px;color:var(--ink2);text-align:center;margin-top:18px;text-decoration:underline;text-underline-offset:3px;}
.tip{font-size:11px;color:var(--ink3);margin-top:9px;line-height:1.6;}
.err-msg{font-size:12px;color:#B5644E;margin-top:10px;text-align:center;line-height:1.5;min-height:16px;}
.spacer{height:8px;}
.install-tip{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px;text-align:left;}
.it-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.it-head svg{width:21px;height:21px;flex:none;}
.it-title{font-size:13px;font-weight:700;letter-spacing:-.01em;}
.it-body{font-size:12px;line-height:1.72;color:var(--ink2);}
.it-body b{color:var(--ink);font-weight:700;}
.it-steps{margin:7px 0 0;padding:0;list-style:none;counter-reset:it;}
.it-steps li{position:relative;padding-left:21px;font-size:12px;line-height:1.75;color:var(--ink2);margin-bottom:2px;}
.it-steps li:before{counter-increment:it;content:counter(it);position:absolute;left:0;top:4px;width:15px;height:15px;border-radius:50%;background:var(--fill);color:var(--ink);font-size:9px;font-weight:700;line-height:15px;text-align:center;}
.it-actions{display:flex;gap:8px;margin-top:13px;}
.seg{display:flex;background:var(--fill);border-radius:13px;padding:3px;margin-bottom:16px;}
.seg-btn{flex:1;height:38px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.01em;}
.seg-btn.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(45,38,28,.09);}
.peek{font-size:12px;line-height:1.65;border-radius:12px;padding:11px 13px;margin-bottom:12px;}
.peek.ok{background:var(--good-soft);color:var(--good-ink);}
.peek.new{background:var(--fill);color:var(--ink2);}
.peek b{font-weight:700;}

/* ---------- 主应用 ---------- */
#app{flex:1;display:flex;flex-direction:column;overflow:hidden;}
main.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:26px;}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 0;font-size:12px;font-weight:600;color:var(--ink2);}
.app-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 14px;}
.app-sub{font-size:12px;color:var(--ink3);letter-spacing:.02em;}
.app-title{font-size:23px;font-weight:700;letter-spacing:-.01em;margin-top:4px;}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink2);
  flex:none;display:flex;align-items:center;justify-content:center;}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.avatars{display:flex;}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;border:2.5px solid #fff;flex:none;}
.av.her{background:var(--her-soft);color:var(--her);}
.av.him{background:var(--him-soft);color:var(--him);}
.avatars .av + .av{margin-left:-12px;}
.av.big{width:44px;height:44px;font-size:14px;border:none;}

.card{background:var(--card);border-radius:20px;padding:18px;margin:0 20px 10px;border:1px solid rgba(37,35,31,.045);}
.sec-title{font-size:12px;color:var(--ink2);letter-spacing:.03em;}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sec-edit{font-size:11px;color:var(--ink2);background:var(--fill);border-radius:8px;padding:6px 10px;}
.sec-edit.plus{color:var(--good-ink);background:var(--good-soft);font-weight:600;}
.hint{font-size:10px;color:var(--ink3);margin-top:11px;line-height:1.55;}

.ring{position:relative;width:76px;height:76px;border-radius:50%;flex:none;
  background:conic-gradient(var(--ink) 0 calc(var(--p) * 1%), #F1EEE9 calc(var(--p) * 1%) 100%);}
.ring i{position:absolute;inset:7px;border-radius:50%;background:#FFFDFB;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:17px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.ring.big{width:92px;height:92px;}
.ring.big i{font-size:20px;}

.hero{background:linear-gradient(158deg,#FFFFFF 0%,#FDF7F3 100%);padding:20px 20px 18px;}
.hero-top{display:flex;align-items:center;gap:16px;}
.hero-info{flex:1;min-width:0;}
.hero-label{font-size:12px;color:var(--ink2);letter-spacing:.03em;}
.hero-num{font-size:46px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:5px 0 3px;font-variant-numeric:tabular-nums;}
.hero-num span{font-size:16px;font-weight:600;color:var(--ink3);margin-left:6px;letter-spacing:0;}
.hero-meta{font-size:11px;color:var(--ink2);}
.hero-meta b{color:var(--ink);font-weight:700;}
.bars{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:13px;}
.bar-row{display:flex;flex-direction:column;gap:7px;}
.bar-line{display:flex;align-items:baseline;gap:8px;font-size:11px;}
.bar-name{font-weight:700;font-size:12px;}
.bar-name.her{color:var(--her);}
.bar-name.him{color:var(--him);}
.bar-nums{color:var(--ink2);font-variant-numeric:tabular-nums;}
.bar-pct{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;}
.bar-pct.her{color:var(--her);}
.bar-pct.him{color:var(--him);}
.bar{height:6px;border-radius:99px;background:#F1EEE9;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease;}
.bar i.her{background:var(--her);}
.bar i.him{background:var(--him);}
.bar.small{height:5px;}

.pair{display:flex;flex-wrap:wrap;gap:12px;margin:0 20px 10px;}
.p-card{flex:1 1 calc(50% - 6px);max-width:calc(50% - 6px);margin:0;padding:15px 14px;min-width:0;}
.p-top{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;}
.dot.her{background:var(--her);}
.dot.him{background:var(--him);}
.p-num{font-size:27px;font-weight:700;letter-spacing:-.03em;margin:9px 0 3px;font-variant-numeric:tabular-nums;}
.p-num span{font-size:12px;font-weight:600;color:var(--ink3);margin-left:3px;letter-spacing:0;}
.p-goal{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-bottom:10px;}
.p-tag{font-size:11px;padding:5px 9px;border-radius:8px;display:inline-block;}
.p-tag.done{background:var(--good-soft);color:var(--good-ink);}
.p-tag.pending{background:var(--fill);color:var(--ink3);}

.todo-item{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--ink2);padding:8px 0;width:100%;text-align:left;}
.cb{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);flex:none;font-size:11px;
  display:flex;align-items:center;justify-content:center;color:transparent;transition:all .15s;}
.cb.on{background:var(--good);border-color:var(--good);color:#fff;}
.todo-add{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--ink3);
  border:1px dashed #DED9D0;border-radius:11px;padding:10px 0;margin-top:9px;width:100%;}
.empty{font-size:12px;color:var(--ink3);text-align:center;padding:14px 0;line-height:1.6;}

.cta{display:block;width:calc(100% - 40px);margin:6px 20px 0;height:54px;border-radius:17px;
  background:var(--ink);color:#fff;font-size:15px;font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;}

/* ---------- tabbar ---------- */
.tabbar{flex:none;height:64px;padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--ink3);}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tab.active{color:var(--ink);font-weight:600;}
.tab.active svg{stroke-width:2.2;}

/* ---------- 记录页 ---------- */
.weigh{text-align:center;padding:24px 20px 20px;}
.weigh-label{font-size:12px;color:var(--ink2);}
.weigh-num{font-size:64px;font-weight:700;letter-spacing:-.045em;line-height:1.05;margin:10px 0 4px;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:center;gap:6px;}
.weigh-num span{font-size:19px;font-weight:600;color:var(--ink3);letter-spacing:0;}
.weigh-num input{font:inherit;letter-spacing:inherit;width:5ch;text-align:right;border:none;background:none;outline:none;
  font-variant-numeric:tabular-nums;border-bottom:2px solid var(--line);}
.weigh-num input:focus{border-bottom-color:var(--ink);}
.weigh-delta{font-size:12px;color:var(--good-ink);font-weight:600;min-height:17px;}
.weigh-hint{font-size:11px;color:var(--ink3);margin-top:4px;}

.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:12px;padding:8px 13px;border-radius:99px;background:var(--fill);color:var(--ink2);
  border:1px solid transparent;white-space:nowrap;}
.chip.active{background:var(--good-soft);color:var(--good-ink);border-color:#D6E7DD;font-weight:600;}
.chip.add{border:1px dashed #DED9D0;background:transparent;color:var(--ink3);}
.chip .x{color:var(--danger);font-weight:400;margin-left:3px;}

.moods{display:flex;gap:8px;}
.mood{flex:1;text-align:center;font-size:12px;padding:11px 0;border-radius:12px;background:var(--fill);color:var(--ink2);}
.mood.active{background:var(--her-soft);color:var(--her);font-weight:600;}

/* ---------- 趋势 ---------- */
.chart-card{padding:18px 16px 12px;}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;}
.chart-sub{font-size:10px;color:var(--ink3);margin-top:3px;}
.legend{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap;justify-content:flex-end;max-width:62%;}
.legend span{display:flex;align-items:center;gap:5px;}
.lg{width:9px;height:9px;border-radius:3px;display:inline-block;}
.lg.her{background:var(--her);}
.lg.him{background:var(--him);}
.chart{width:100%;display:block;margin-top:6px;}

.tl-item{display:flex;gap:12px;padding-bottom:16px;position:relative;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;left:4px;top:14px;bottom:0;width:1px;background:var(--line);}
.tl-item:last-child::before{display:none;}
.tl-dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px;z-index:1;}
.tl-dot.her{background:var(--her);box-shadow:0 0 0 3px var(--her-soft);}
.tl-dot.him{background:var(--him);box-shadow:0 0 0 3px var(--him-soft);}
.tl-dot.plain{background:var(--ink3);box-shadow:0 0 0 3px var(--fill);}
.tl-t{font-size:13px;font-weight:600;}
.tl-d{font-size:11px;color:var(--ink3);margin-top:3px;}

.stats{display:flex;padding:18px 0;}
.stat{flex:1;text-align:center;border-right:1px solid var(--line);}
.stat:last-child{border-right:none;}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.stat span{font-size:10px;color:var(--ink3);display:block;margin-top:4px;}

/* ---------- 奖励 ---------- */
.rw-summary{display:flex;gap:18px;font-size:11px;color:var(--ink2);padding:0 4px 14px;}
.rw-summary b{color:var(--ink);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;}
.reward{border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px;background:#fff;}
.reward:last-child{margin-bottom:0;}
.reward.pending{border-color:#D6E7DD;background:linear-gradient(150deg,#FBFDFC,#F3F9F5);}
.reward.done{opacity:.62;}
.rw-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.rw-who{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;flex:none;}
.rw-who.her{background:var(--her-soft);color:var(--her);}
.rw-who.him{background:var(--him-soft);color:var(--him);}
.rw-who.both{background:var(--fill);color:var(--ink2);}
.rw-state{margin-left:auto;font-size:10px;color:var(--ink3);}
.rw-state.wait{color:var(--good-ink);font-weight:700;}
.rw-cond{font-size:14px;font-weight:700;letter-spacing:-.01em;}
.rw-prize{font-size:12px;color:var(--ink2);margin-top:5px;}
.rw-prize b{color:var(--ink);font-weight:600;}
.reward .bar{margin-top:11px;}
.rw-act{display:flex;gap:8px;margin-top:12px;}
.rw-btn{flex:1;height:36px;border-radius:11px;background:var(--ink);color:#fff;font-size:12px;font-weight:600;}
.rw-btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line);font-weight:500;}
.rw-done-bar{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--good-ink);margin-top:10px;}

/* ---------- 我们 ---------- */
.duo-item{display:flex;align-items:center;gap:13px;}
.duo-item + .duo-item{padding-top:14px;border-top:1px solid var(--line);margin-top:14px;}
.duo-info{flex:1;min-width:0;}
.duo-name{font-size:14px;font-weight:600;}
.duo-meta{font-size:11px;color:var(--ink3);margin-top:3px;}
.duo-streak{font-size:12px;font-weight:700;color:var(--good-ink);background:var(--good-soft);padding:5px 10px;border-radius:9px;flex:none;}

.msg{display:flex;flex-direction:column;margin-bottom:12px;}
.msg.right{align-items:flex-end;}
.bubble{max-width:76%;font-size:13px;line-height:1.55;padding:10px 14px;border-radius:15px;background:var(--fill);color:var(--ink);word-break:break-word;}
.msg.right .bubble{background:var(--him-soft);color:#3E5978;}
.composer{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.composer .input{flex:1;width:auto;min-width:0;height:44px;font-size:13px;}
.composer .send{font-size:12px;font-weight:600;color:#fff;background:var(--ink);border-radius:11px;padding:13px 15px;flex:none;}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;}
.badge{display:flex;flex-direction:column;align-items:center;gap:7px;}
.badge i{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:12px;font-weight:700;background:#F2EFEA;color:var(--ink3);}
.badge.on i{background:var(--good-soft);color:var(--good-ink);}
.badge span{font-size:10px;color:var(--ink3);text-align:center;line-height:1.3;}
.badge.on span{color:var(--ink2);}

/* ---------- 设置 ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:12px;}
.set-row:last-child{border-bottom:none;padding-bottom:0;}
.set-row:first-child{padding-top:0;}
.set-label{font-size:13px;color:var(--ink2);flex:none;}
.set-val{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;}
.set-val em{font-style:normal;font-size:12px;font-weight:500;color:var(--ink3);margin-left:3px;}
.set-input{width:110px;height:40px;border-radius:11px;border:1px solid var(--line);background:#fff;
  padding:0 12px;font-size:14px;text-align:right;outline:none;font-variant-numeric:tabular-nums;}
.set-input:focus{border-color:#D6D0C6;}
.set-ring{display:flex;align-items:center;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
.sr-title{font-size:13px;font-weight:600;}
.sr-meta{font-size:11px;color:var(--ink2);margin-top:5px;line-height:1.6;}
.sr-meta b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
.edit-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.edit-row:last-of-type{border-bottom:none;}
.drag{width:13px;height:13px;flex:none;}
.edit-txt{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.del{width:22px;height:22px;border-radius:50%;background:var(--danger-soft);color:var(--danger);font-size:14px;
  line-height:1;display:flex;align-items:center;justify-content:center;flex:none;}

/* ---------- sheet ---------- */
.sheet-mask{position:fixed;inset:0;background:rgba(30,26,20,.34);z-index:50;opacity:0;transition:opacity .22s;backdrop-filter:blur(2px);}
.sheet-mask.show{opacity:1;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:24px 24px 0 0;
  max-height:92vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);}
.sheet.show{transform:translateY(0);}
.sheet-head{flex:none;display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px;}
.sheet-title{font-size:18px;font-weight:700;letter-spacing:-.01em;}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(26px + env(safe-area-inset-bottom));}
.grabber{width:36px;height:4px;border-radius:99px;background:#DED9D0;margin:9px auto 0;}

#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);z-index:80;background:rgba(37,35,31,.93);
  color:#fff;font-size:13px;padding:11px 18px;border-radius:12px;opacity:0;transition:all .24s;pointer-events:none;max-width:88vw;text-align:center;}
#toast.show{opacity:1;transform:translate(-50%,0);}

.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--ink);
  border-radius:50%;animation:sp .8s linear infinite;margin-bottom:16px;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>

  publishableKey: ['wbpk_RU06', 'XiFs5hWfDTSOoVZn2z', '_pg53tQkNKBwtQ', 'kMWkopNq9A613kOb43C'].join('')

/* ---------- 工具 ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDate(s){ var p=String(s).slice(0,10).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmtCN(s){ var d=parseDate(s); return (d.getMonth()+1)+'月'+pad(d.getDate())+'日'; }
function weekCN(d){ return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]; }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
function n1(v){ return (v==null||v==='')?'—':Number(v).toFixed(1); }
var PALETTE = ['#D98B72','#6F8CB8','#7FAE92','#A98BC4','#C9A227','#6FA6A0'];
/* 配色按「在当前空间里的加入顺序」分配，所以换到另一个组也不会串色 */
function memberIndex(p){
  if (!p) return 0;
  for (var i=0;i<S.profiles.length;i++){
    if (S.profiles[i].owner_id === p.owner_id) return i;
  }
  return 0;
}
function colorOf(p){ return PALETTE[memberIndex(p) % PALETTE.length]; }
function roleOf(p){ return 'c' + (memberIndex(p) % PALETTE.length); }
function roleLabel(p){ return p ? esc(p.nickname) : '—'; }
function roleClass(p){ return 'av '+roleOf(p); }
/* 空间的口头叫法：直接用成员昵称，自己显示成「我」 */
function spaceLabel(spaceId, members){
  var ms = (members || []).slice().sort(function(x,y){ return x.id - y.id; });
  var names = ms.map(function(p){ return p.owner_id === uid ? '我' : p.nickname; });
  return names.length ? names.join('、') : spaceId;
}
function curSpaceStore(){ try { return localStorage.getItem('cur_space') || ''; } catch(e){ return ''; } }
function setCurSpace(v){ try { if (v) localStorage.setItem('cur_space', v); else localStorage.removeItem('cur_space'); } catch(e){} }
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('show'); }, 2200);

/* ---------- 打开 SDK ---------- */
function initCloud(){
  if (!window.WorkBuddyCloud || !WorkBuddyCloud.createWorkBuddyCloud) {
    throw new Error('SDK 加载失败');
  }
  cloud = WorkBuddyCloud.createWorkBuddyCloud({
    endpoint: PUBLIC_CONFIG.endpoint,
    oauthRelayBaseUrl: PUBLIC_CONFIG.oauthRelayBaseUrl,
    publishableKey: PUBLIC_CONFIG.publishableKey
  });
}

/* ---------- 数据访问 ---------- */
function unwrap(res){
  if (res && res.error) throw res.error;
  return res ? res.data : null;
}

async function loadAll(){
  var pr = unwrap(await cloud.database.from('profiles').select('*').order('id')) || [];
  S.allProfiles = pr;
  S.myProfiles  = pr.filter(function(p){ return p.owner_id === uid; });
  if (!S.myProfiles.length) {
    S.profile = null; S.profiles = []; S.others = []; S.partner = null;
    S.records = []; S.allRecords = []; S.todos = []; S.tags = []; S.rewards = []; S.messages = [];
    return false;
  }
  // 当前空间：优先用记住的那个，失效就回到第一个
  var ids  = S.myProfiles.map(function(p){ return p.space_id; });
  var want = curSpaceStore();
  if (ids.indexOf(want) < 0) want = ids[0];
  S.space = want;
  setCurSpace(want);

  S.profiles = S.allProfiles.filter(function(p){ return p.space_id === want; })
                             .sort(function(x,y){ return x.id - y.id; });
  S.profile  = S.profiles.filter(function(p){ return p.owner_id === uid; })[0] || null;
  if (!S.profile) return false;
  S.others  = S.profiles.filter(function(p){ return p.owner_id !== uid; });
  S.partner = S.others[0] || null;

  var rs = await Promise.all([
    cloud.database.from('records').select('*').order('record_date'),
    cloud.database.from('todos').select('*').order('sort').order('id'),
    cloud.database.from('tags').select('*').order('sort').order('id'),
    cloud.database.from('rewards').select('*').order('id'),
    cloud.database.from('messages').select('*').order('id')
  ]);
  var sp = S.space;
  function inSpace(i){ return (unwrap(rs[i]) || []).filter(function(r){ return r.space_id === sp; }); }
  S.allRecords = unwrap(rs[0]) || [];
  S.records  = inSpace(0);
  S.todos    = inSpace(1);
  S.tags     = inSpace(2);
  S.rewards  = inSpace(3);
  S.messages = inSpace(4);
  return true;
}

/* ---------- 计算 ---------- */
function recsOf(pid){
  return S.records.filter(function(r){ return r.owner_id === pid; })
    .sort(function(a,b){ return a.record_date < b.record_date ? -1 : 1; });
}
function latestRec(pid){
  var arr = recsOf(pid);
  return arr.length ? arr[arr.length-1] : null;
}
function recOn(pid, date){
  return S.records.filter(function(r){ return r.owner_id===pid && String(r.record_date).slice(0,10)===date; })[0] || null;
}
function statsOf(p){
  if (!p) return null;
  var arr = recsOf(p.owner_id);
  var start = p.start_weight!=null ? Number(p.start_weight) : null;
  var target = p.target_weight!=null ? Number(p.target_weight) : null;
  var latest = arr.length ? Number(arr[arr.length-1].weight) : null;
  var cur = latest!=null ? latest : start;
  var lost = (start!=null && cur!=null) ? start-cur : 0;
  var need = (start!=null && target!=null) ? start-target : 0;
  var pct = need>0 ? Math.max(0, Math.min(100, Math.round(lost/need*100))) : 0;
  var remain = (cur!=null && target!=null) ? cur-target : null;
  return {
    profile:p, records:arr, start:start, target:target, latest:latest, cur:cur,
    lost:lost, need:need, pct:pct, remain:remain,
    hasToday: !!recOn(p.owner_id, todayStr()),
    streak: streakOf(arr),
    days: startDateOf(arr)
  };
}
function startDateOf(arr){
  if (!arr.length) return null;
  return String(arr[0].record_date).slice(0,10);
}
function streakOf(arr){
  if (!arr.length) return 0;
  var dates = {};
  arr.forEach(function(r){ dates[String(r.record_date).slice(0,10)] = 1; });
  var d = new Date(); var n = 0;
  // 若今天还没记，从昨天起算
  if (!dates[dateStr(d)]) d.setDate(d.getDate()-1);
  while (dates[dateStr(d)]) { n++; d.setDate(d.getDate()-1); }
  return n;
}
function together(){
  var list = S.profiles.map(statsOf).filter(Boolean);
  var totalLost = 0, totalNeed = 0, maxStreak = 0;
  list.forEach(function(x){
    totalLost += (x.lost || 0);
    totalNeed += (x.need || 0);
    if ((x.streak || 0) > maxStreak) maxStreak = x.streak;
  });
  var pct = totalNeed > 0 ? Math.max(0, Math.min(100, Math.round(totalLost / totalNeed * 100))) : 0;
  return { lost: totalLost, need: totalNeed, pct: pct, list: list, streak: maxStreak };
}

  if (list.length) {
    html += '  <div class="bars">';
    list.forEach(function(x){
      var rc = roleOf(x.profile);
      html += '    <div class="bar-row">';
      html += '      <div class="bar-line">';
      html += '        <span class="bar-name '+rc+'">'+esc(x.profile.nickname)+(x.profile.owner_id===uid?'（我）':'')+'</span>';
      html += '        <span class="bar-nums">'+n1(x.cur)+' → '+n1(x.target)+'</span>';
      html += '        <span class="bar-pct '+rc+'">'+x.pct+'%</span>';
      html += '      </div>';
      html += '      <div class="bar"><i class="'+rc+'" style="width:'+x.pct+'%"></i></div>';
      html += '    </div>';
    });
    html += '  </div>';
  }
  html += '</div>';

  if (!S.others.length) {
    html += '<div class="card"><div class="empty">这个空间现在只有你一个人。<br>把口令「<b>'+esc(S.profile.space_id)+'</b>」发给要一起的人，<br>他登录后填同样的口令就能进来。</div></div>';
  }

  // 每个人一张卡
  html += '<div class="pair">';
  list.forEach(function(x){
    var p = x.profile;
    html += '<div class="card p-card">';
    html += '  <div class="p-top"><span class="dot '+roleOf(p)+'"></span>'+esc(p.nickname)+(p.owner_id===uid?'（我）':'')+'</div>';
    html += '  <div class="p-num">'+n1(x.cur)+'<span>kg</span></div>';
    html += '  <div class="p-goal">目标 '+n1(x.target)+' · 已减 '+n1(x.lost)+'</div>';
    html += '  <div class="p-tag '+(x.hasToday?'done':'pending')+'">'+(x.hasToday?'今天已打卡':'今天还没记录')+'</div>';
    html += '</div>';
  });
  html += '</div>';

  // 今日小目标
  html += '<div class="card">';
  html += '  <div class="sec-head"><div class="sec-title">今天的小目标</div>';
  html += '    <button class="sec-edit" id="go-settings-todo">编辑</button></div>';
  var today = recOn(uid, todayStr());
  var doneIds = (today && today.todo_done) ? today.todo_done : [];
  if (!S.todos.length) {
    html += '  <div class="empty">还没有小目标<br>去「编辑」里加几条，每天勾一下</div>';
  } else {
    S.todos.forEach(function(td){
      var on = doneIds.indexOf(td.id) >= 0;
      html += '<button class="todo-item" data-todo="'+td.id+'">';
      html += '  <span class="cb '+(on?'on':'')+'">✓</span>'+esc(td.text)+'</button>';
    });
  }
  html += '  <button class="todo-add" id="go-settings-todo2">+ 管理小目标</button>';
  html += '</div>';

  html += '<button class="cta" id="btn-go-record">'+(me && me.hasToday ? '修改今天的记录' : '记录今天的体重')+'</button>';

  $('home-body').innerHTML = html;

  var gt = $('go-settings-todo'), gt2 = $('go-settings-todo2');
  if (gt) gt.onclick = openSettings;
  if (gt2) gt2.onclick = openSettings;
  $('btn-go-record').onclick = function(){ switchTab('record'); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-todo]'), function(el){
    el.onclick = function(){ toggleTodo(+el.getAttribute('data-todo')); };
  });
}

/* ---------- 渲染：记录 ---------- */
function renderRecord(){
  var now = new Date();
  $('rec-date').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';

  var mine = statsOf(S.profile);
  var today = recOn(uid, todayStr());
  var weight = S.draft.weight != null ? S.draft.weight
             : (today ? Number(today.weight) : (mine && mine.latest != null ? mine.latest : (mine? mine.start : '')));
  if (S.draft.weight == null) S.draft.weight = weight;
  S.draft.tags = today ? (today.tags||[]).slice() : (S.draft.tags||[]);
  S.draft.todoDone = today ? (today.todo_done||[]).slice() : (S.draft.todoDone||[]);
  S.draft.mood = today ? (today.mood||null) : S.draft.mood;
  S.draft.note = today ? (today.note||'') : (S.draft.note||'');

  var prev = null;
  if (mine && mine.records.length) {
    var arr = mine.records.filter(function(r){ return String(r.record_date).slice(0,10) < todayStr(); });
    if (arr.length) prev = Number(arr[arr.length-1].weight);
  }
  var deltaHtml = '';
  if (prev != null && weight !== '') {
    var dv = Number(weight) - prev;
    deltaHtml = dv < 0 ? '比上次轻了 '+Math.abs(dv).toFixed(1)+'kg'
              : (dv > 0 ? '比上次重了 '+dv.toFixed(1)+'kg' : '和上次一样');
  }

  var MOODS = ['很开心','还不错','有点难','想放弃'];
  var html = '';

  html += '<div class="card weigh">';
  html += '  <div class="weigh-label">今天早上的空腹体重</div>';
  html += '  <div class="weigh-num"><input id="rec-weight" type="number" inputmode="decimal" step="0.1" value="'+esc(weight)+'"><span>kg</span></div>';
  html += '  <div class="weigh-delta">'+esc(deltaHtml)+'</div>';
  html += '  <div class="weigh-hint">点数字可以直接改</div>';
  html += '</div>';

  html += '<div class="card">';
  html += '  <div class="sec-head"><div class="sec-title">今天做到了什么</div>';
  html += '    <button class="sec-edit" id="go-settings-tag">编辑标签</button></div>';
  html += '  <div class="chips" id="rec-tags">';
  S.tags.forEach(function(tg){
    var on = S.draft.tags.indexOf(tg.text) >= 0;
    html += '<button class="chip '+(on?'active':'')+'" data-tag="'+esc(tg.text)+'">'+esc(tg.text)+'</button>';
  });
  html += '    <button class="chip add" id="rec-tag-add">+ 自定义</button>';
  html += '  </div>';
  html += '</div>';

  if (S.todos.length) {

function seriesOf(s){
  if (!s || s.target == null) return [];
  return s.records.map(function(r){
    return { date:String(r.record_date).slice(0,10), remain: Number(r.weight) - s.target };
  });
}
function renderChart(list){
  var series = (list || []).map(seriesOf);
  var all = [];
  series.forEach(function(a){ all = all.concat(a); });
  var W=320, H=150, L=30, R=312, T=12, B=132;
  if (all.length < 2) {
    return '<div class="empty" style="padding:34px 0">记录两天以上，这里就会画出曲线</div>';
  }
  var dates = {};
  all.forEach(function(p){ dates[p.date]=1; });
  var ds = Object.keys(dates).sort();
  if (ds.length < 2) return '<div class="empty" style="padding:34px 0">记录两天以上，这里就会画出曲线</div>';
  var vmin = Math.min.apply(null, all.map(function(p){return p.remain;}));
  var vmax = Math.max.apply(null, all.map(function(p){return p.remain;}));
  var lo = Math.floor(vmin-0.6), hi = Math.ceil(vmax+0.6);
  if (hi - lo < 2) { hi = lo + 2; }
  var pad = (hi-lo)*0.12; lo -= pad; hi += pad;

  function X(d){ var i = ds.indexOf(d); return L + (R-L) * (ds.length===1?0.5:i/(ds.length-1)); }
  function Y(v){ return B - (B-T) * ((v-lo)/(hi-lo)); }
  function path(arr){
    if (!arr.length) return null;
    return arr.map(function(p,i){ return (i?'L':'M') + X(p.date).toFixed(1) + ',' + Y(p.remain).toFixed(1); }).join(' ');
  }
  function area(arr){
    var pth = path(arr); if (!pth) return null;
    var lastX = X(arr[arr.length-1].date).toFixed(1), firstX = X(arr[0].date).toFixed(1);
    return pth + ' L'+lastX+','+B+' L'+firstX+','+B+' Z';
  }

  var gridLines = '', labels = '';
  for (var i=0;i<=4;i++){
    var v = lo + (hi-lo)*i/4, y = Y(v);
    gridLines += '<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+R+'" y2="'+y.toFixed(1)+'"/>';
    labels += '<text x="'+(L-7)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+v.toFixed(1)+'</text>';
  }
  var xlab = '';
  [0, Math.floor((ds.length-1)/2), ds.length-1].filter(function(v,i,arr){ return arr.indexOf(v)===i; }).forEach(function(i, idx, arr){
    var anchor = idx===0 ? 'start' : (idx===arr.length-1 ? 'end' : 'middle');
    xlab += '<text x="'+X(ds[i]).toFixed(1)+'" y="'+(B+14)+'" text-anchor="'+anchor+'">'+fmtCN(ds[i])+'</text>';
  });

  var defs = '';
  for (var k=0;k<series.length;k++){
    var ck = PALETTE[k % PALETTE.length];
    defs += '<linearGradient id="g'+k+'" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0%" stop-color="'+ck+'" stop-opacity="0.20"/>'
          + '<stop offset="100%" stop-color="'+ck+'" stop-opacity="0"/></linearGradient>';
  }
  var body = '';
  for (var m2=series.length-1; m2>=0; m2--){
    if (series[m2].length>1) { var ar = area(series[m2]); if (ar) body += '<path d="'+ar+'" fill="url(#g'+m2+')"/>'; }
  }
  for (var n2=series.length-1; n2>=0; n2--){
    var cn = PALETTE[n2 % PALETTE.length];
    if (series[n2].length>1) body += '<path d="'+path(series[n2])+'" fill="none" stroke="'+cn+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  for (var q=0;q<series.length;q++){
    var cq = PALETTE[q % PALETTE.length], pq = series[q];
    if (pq.length) body += '<circle cx="'+X(pq[pq.length-1].date).toFixed(1)+'" cy="'+Y(pq[pq.length-1].remain).toFixed(1)+'" r="3.2" fill="#fff" stroke="'+cq+'" stroke-width="2"/>';
  }

  var svg = '<svg class="chart" viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg">';
  svg += '<defs>'+defs+'</defs>';
  svg += '<g stroke="#EFEBE4" stroke-width="1">'+gridLines+'</g>';
  svg += '<g font-size="9" fill="#BDB7AD" font-family="-apple-system,sans-serif">'+labels+xlab+'</g>';
  svg += body;
  svg += '</svg>';
  return svg;
}

function buildMilestones(list){
  var out = [];
  (list || []).forEach(function(s){
    var name = s.profile.nickname;
    [10,5,3,1].forEach(function(mk){
      if (s.lost >= mk) {
        out.push({ cls: roleOf(s.profile), title: name+' 累计减重 '+mk+'kg',
                   sub: '已减 '+n1(s.lost)+'kg · 距离目标还剩 '+n1(s.remain)+'kg',
                   sort: mk, key: name+mk });
      }
    });
    if (s.streak >= 7) out.push({ cls:'plain', title:'连续打卡 '+s.streak+' 天', sub: name+' 保持住', sort:s.streak, key:'st'+name });
  });
  var seen = {}, uniq = [];
  out.sort(function(x,y){ return y.sort - x.sort; });
  out.forEach(function(m){ if (!seen[m.key]) { seen[m.key]=1; uniq.push(m); } });
  return uniq.slice(0,5);
}

function rewardCard(r, state){
  var owner = S.profiles.filter(function(p){ return p.owner_id === r.owner_id; })[0];
  var promise = S.profiles.filter(function(p){ return p.owner_id === r.promise_by; })[0];

  var pName = promise ? promise.nickname : '—';
  var cls = owner ? roleOf(owner) : 'both';
  var html = '<div class="reward '+state+'">';
  html += '  <div class="rw-top"><span class="rw-who '+cls+'">'+esc(oName)+'</span>';
  if (state==='pending') html += '<span class="rw-state wait">已达成 · 等兑现</span>';
  else if (state==='done') html += '<span class="rw-state">'+fmtCN(r.redeemed_at||r.created_at)+' 已兑现</span>';
  else html += '<span class="rw-state">还差 '+rewardGap(r, owner)+'</span>';
  html += '  </div>';
  html += '  <div class="rw-cond">'+esc(r.condition_text)+'</div>';
  html += '  <div class="rw-prize">奖励：<b>'+esc(pName)+' '+esc(String(r.prize||'').replace(/^[：:]\s*/,''))+'</b></div>';
  if (state==='active') {
    html += '<div class="bar small"><i class="'+cls+'" style="width:'+rewardPct(r, owner)+'%"></i></div>';
  }
  if (state==='pending') {
    var mine = r.promise_by === uid;
    html += '<div class="rw-act">';
    if (mine) {
      html += '<button class="rw-btn" data-reward="'+r.id+'" data-act="done">已经兑现了</button>';
      html += '<button class="rw-btn ghost" data-reward="'+r.id+'" data-act="later">再等等</button>';
    } else {
      html += '<button class="rw-btn ghost">等他确认</button>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}
function rewardGap(r, owner){
  if (!owner || r.target_weight==null) return '—';
  var s = statsOf(owner);
  if (!s || s.cur==null) return '—';
  var g = s.cur - Number(r.target_weight);
  return g>0 ? g.toFixed(1)+'kg' : '已达成';
}
function rewardPct(r, owner){
  if (!owner || r.target_weight==null) return 0;
  var s = statsOf(owner);
  if (!s || s.start==null || s.cur==null) return 0;
  var need = s.start - Number(r.target_weight);
  if (need<=0) return 100;
  return Math.max(0, Math.min(100, Math.round((s.start-s.cur)/need*100)));
}
function badges(list, days){
  var maxLost = 0, totalLost = 0, maxStreak = 0;
  (list || []).forEach(function(s){
    if ((s.lost||0) > maxLost) maxLost = s.lost;
    totalLost += (s.lost || 0);
    if ((s.streak||0) > maxStreak) maxStreak = s.streak;
  });
  var doneCount = S.rewards.filter(function(r){return r.status==='done';}).length;
  var list2 = [
    { on: days>=1,        ico:'1',    name:'第一天' },
    { on: maxStreak>=7,   ico:'7',    name:'连续七天' },
    { on: maxLost>=5,     ico:'5kg',  name:'单人减重 5kg' },
    { on: maxStreak>=30,  ico:'30',   name:'连续三十天' },
    { on: totalLost>=20,  ico:'20kg', name:'一起减 20kg' },
    { on: doneCount>=1,   ico:'✓',    name:'第一次兑现' }
  ];
  return list2.map(function(x){
    return '<div class="badge '+(x.on?'on':'')+'"><i>'+x.ico+'</i><span>'+x.name+'</span></div>';
  }).join('');
}

async function toggleTodo(id){
  var today = recOn(uid, todayStr());
  var done = today && today.todo_done ? today.todo_done.slice() : [];
  var i = done.indexOf(id);
  if (i>=0) done.splice(i,1); else done.push(id);
  try {
    if (today) {
      unwrap(await cloud.database.from('records').update({ todo_done: done }).eq('id', today.id).select());
    } else {
      // 还没记录体重时，先记一条：用最近体重
      var s = statsOf(S.profile);
      if (s.latest == null) { toast('先去「记录」填一次体重'); return; }
      unwrap(await cloud.database.from('records').insert({
        owner_name: S.profile.nickname, space_id: S.profile.space_id,
        record_date: todayStr(), weight: s.latest, todo_done: done
      }).select());
    }
    var idx = S.records.findIndex(function(r){ return r.owner_id===uid && String(r.record_date).slice(0,10)===todayStr(); });
    if (today) { today.todo_done = done; }
    else { await loadAll(); }
    renderHome();
  } catch(e){ toast('保存失败：'+(e && e.message || '请重试')); }
}

async function saveRecord(){
  var w = Number(S.draft.weight);
  if (!w || w < 20 || w > 400) { toast('请填一个合理的体重'); return; }
  var btn = $('btn-save-rec'); btn.disabled = true; btn.textContent = '保存中…';
  try {
    var today = recOn(uid, todayStr());
    var payload = {
      weight: w, tags: S.draft.tags || [], todo_done: S.draft.todoDone || [],
      mood: S.draft.mood || null, note: S.draft.note || null
    };
    if (today) {
      unwrap(await cloud.database.from('records').update(payload).eq('id', today.id).select());
    } else {
      payload.owner_name = S.profile.nickname;
      payload.space_id = S.profile.space_id;
      payload.record_date = todayStr();
      unwrap(await cloud.database.from('records').insert(payload).select());
    }
    await mirrorToday(w);
    S.draft = { weight:null, tags:[], todoDone:[], mood:null, note:'' };
    await loadAll();
    await autoCheckRewards();
    toast('已保存，他能看到了');
    switchTab('home');
  } catch(e){
    toast('保存失败：'+(e && e.message || '请重试'));
    btn.disabled = false; btn.textContent = '保存';
  }
}

/* 我在别的空间里也该显示今天的体重：记一次，其他组跟着同步。
   那边没有今天的记录就新建；已经有就只改体重/标签/心情，不动它自己的小目标勾选。 */
async function mirrorToday(w){
  var tags = (S.draft.tags || []).slice();
  var mood = S.draft.mood || null;
  var others = S.myProfiles.filter(function(p){ return p.space_id !== S.space; });
  for (var i=0;i<others.length;i++){
    var sp = others[i].space_id;
    var ex = S.allRecords.filter(function(x){
      return x.space_id === sp && x.owner_id === uid && String(x.record_date).slice(0,10) === todayStr();
    })[0];
    try {
      if (ex) {
        unwrap(await cloud.database.from('records').update({ weight:w, tags:tags, mood:mood }).eq('id', ex.id).select());
      } else {
        unwrap(await cloud.database.from('records').insert({
          owner_name: S.profile.nickname, space_id: sp, record_date: todayStr(),
          weight: w, tags: tags, todo_done: [], mood: mood
        }).select());
      }
    } catch(e){ /* 单个空间失败不影响主流程 */ }
  }
}

async function rewardAction(id, act){
  var r = S.rewards.filter(function(x){ return x.id===id; })[0];
  if (!r) return;
  try {
    if (act === 'done') {
      unwrap(await cloud.database.from('rewards').update({ status:'done', redeemed_at: new Date().toISOString() }).eq('id', id).select());
      toast('已兑现 ✓');
    } else if (act === 'later') {
      // 只是隐藏提示，不改状态
      toast('好，先挂着');
      return;
    } else if (act === 'del') {
      unwrap(await cloud.database.from('rewards').delete().eq('id', id).select());
      toast('已删除');
    }
    await loadAll(); renderUs();
  } catch(e){ toast('操作失败：'+(e && e.message || '请重试')); }
}

/* 达标自动解锁：把已达成的 active 变成 pending */
async function autoCheckRewards(){
  var changed = false;
  for (var i=0;i<S.rewards.length;i++){
    var r = S.rewards[i];
    if (r.status !== 'active' || r.target_weight == null) continue;
    var owner = S.profiles.filter(function(p){ return p.owner_id===r.owner_id; })[0];
    if (!owner) continue;
    var s = statsOf(owner);
    if (s && s.cur != null && s.cur <= Number(r.target_weight)) {
      try {
        unwrap(await cloud.database.from('rewards')
          .update({ status:'pending', achieved_at: new Date().toISOString() })
          .eq('id', r.id).select());
        changed = true;
      } catch(e){}
    }
  }
  if (changed) await loadAll();
}

/* ---------- 登录 ---------- */
function setLoginMode(mode){
  loginMode = mode;
  if (mode === 'phone') {
    $('f-phone').classList.remove('hidden'); $('f-email').classList.add('hidden');
    $('btn-switch-method').textContent = '改用邮箱登录';
  } else {
    $('f-email').classList.remove('hidden'); $('f-phone').classList.add('hidden');
    $('btn-switch-method').textContent = '改用手机号登录';
  }
  $('login-err').textContent = '';
  pendingOtp = null;
}
function countdown(btn, sec){
  btn.disabled = true; var n = sec;
  btn.textContent = n + 's';
  clearInterval(sendTimer);
  sendTimer = setInterval(function(){
    n--; btn.textContent = n + 's';
    if (n <= 0) { clearInterval(sendTimer); btn.disabled = false; btn.textContent = '重新获取'; }
  }, 1000);
}
async function sendCode(){
  $('login-err').textContent = '';
  if (loginMode === 'phone') {
    var phone = ($('phone').value||'').trim();
    if (!/^1\d{10}$/.test(phone)) {
      $('phone-err').classList.remove('hidden');
      return;
    }
    $('phone-err').classList.add('hidden');
    var b = $('btn-send-code'); b.disabled = true; b.textContent = '发送中…';
    var res = await cloud.auth.sendOtp({ phone: phone });
    if (res.error) { b.disabled = false; b.textContent = '获取验证码'; $('login-err').textContent = res.error.message || '发送失败'; return; }
    pendingOtp = { kind:'phone', value:phone, verificationId:res.data.verificationId, isExistingUser:res.data.isExistingUser };
    countdown(b, 60);
  } else {
    var email = ($('email').value||'').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      $('email-err').classList.remove('hidden');
      return;
    }
    $('email-err').classList.add('hidden');
    var b2 = $('btn-send-email'); b2.disabled = true; b2.textContent = '发送中…';
    var res2 = await cloud.auth.sendOtp({ email: email });
    if (res2.error) { b2.disabled = false; b2.textContent = '获取验证码'; $('login-err').textContent = res2.error.message || '发送失败'; return; }
    pendingOtp = { kind:'email', value:email, verificationId:res2.data.verificationId, isExistingUser:res2.data.isExistingUser };
    countdown(b2, 60);
  }
}
async function doLogin(){
  $('login-err').textContent = '';
  var token = ($('token').value||'').trim();
  if (!pendingOtp) { $('login-err').textContent = '请先获取验证码'; return; }
  if (!token) { $('login-err').textContent = '请输入验证码'; return; }
  var btn = $('btn-login'); btn.disabled = true; btn.textContent = '登录中…';
  var args = pendingOtp.kind === 'phone'
    ? { phone: pendingOtp.value, verificationId: pendingOtp.verificationId, isExistingUser: pendingOtp.isExistingUser, token: token }
    : { email: pendingOtp.value, verificationId: pendingOtp.verificationId, isExistingUser: pendingOtp.isExistingUser, token: token };
  var res = await cloud.auth.verifyOtp(args);
  btn.disabled = false; btn.textContent = '登录 / 注册';
  if (res.error) { $('login-err').textContent = res.error.message || '验证码不对，或者已过期'; return; }
  pendingOtp = null;
  await afterLogin(res.data);
}
async function doLogout(){
  try { await cloud.auth.signOut(); } catch(e){}
  S.profile = null; S.partner = null; S.others = []; S.profiles = []; S.myProfiles = []; S.allProfiles = [];
  S.space = ''; setCurSpace('');
  S.records=[]; S.allRecords=[]; S.todos=[]; S.tags=[]; S.rewards=[]; S.messages=[];
  closeSheet(); show('view-login');

/* ---------- 启动流程 ---------- */
async function afterLogin(){
  var sess = await cloud.auth.getSession();
  var s = sess && sess.data;
  uid = (s && s.user && (s.user.id || s.user.uid)) || '';
  if (!uid) { show('view-login'); return; }
  S.loggedIn = true;
  show('view-boot');
  try {
    var ok = await loadAll();
    // 邀请链接：?space=CODE
    var inv = null;
    try {
      var mm = location.search.match(/[?&]space=([^&]+)/);
      if (mm) inv = decodeURIComponent(mm[1]).trim().toUpperCase();
    } catch(e){}
    if (inv && !S.myProfiles.some(function(p){ return p.space_id === inv; })) {
      // 别人发的邀请，我还没在这一组里 → 直接进「加入」流程
      show('view-pair');
      initPairForm(ok ? true : false, inv);
      return;
    }
    if (inv) { setCurSpace(inv); ok = await loadAll(); }
    if (!ok) { show('view-pair'); initPairForm(false); return; }
    await autoCheckRewards();
    show('app'); renderAll();
  } catch(e){
    show('view-login');
    $('login-err').textContent = '读取数据失败：' + (e && e.message || '请重试');
  }
}

function pairBtnLabel(){ return pairAdd ? '加入 / 创建这个空间' : '开始记录'; }
function initPairForm(addMode, prefill){
  pairAdd = !!addMode;
  var me = S.profile;
  $('pair-nick').value   = me ? (me.nickname || '') : '';
  $('pair-start').value  = (me && me.start_weight != null) ? me.start_weight : '';
  $('pair-target').value = (me && me.target_weight != null) ? me.target_weight : '';
  $('pair-err').textContent = '';
  $('pair-title').textContent = pairAdd ? '再加一个空间' : '最后一步';
  $('btn-pair-back').classList.toggle('hidden', !pairAdd);
  $('btn-pair').textContent = pairBtnLabel();

  var pre = prefill || null;
  if (!pre) {
    try {
      var m = location.search.match(/[?&]space=([^&]+)/);
      if (m) pre = decodeURIComponent(m[1]).trim().toUpperCase();
    } catch(e){}
  }
  if (pre) { setPairMode('join'); $('pair-space').value = pre; peekSpace(pre); }
  else { setPairMode('create'); $('pair-space').value = makeCode(); }
}
function makeCode(){
  var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', o = 'FIT-';
  for (var i=0;i<6;i++) o += A[Math.floor(Math.random()*A.length)];
  return o;
}
function onSpaceInput(){
  var el = $('pair-space');
  el.value = (el.value||'').toUpperCase();
  $('pair-peek').classList.add('hidden');
  $('pair-err').textContent = '';
  if (pairMode !== 'join') return;
  var code = el.value.trim();
  if (code.length < 6) return;
  clearTimeout(peekTimer);
  peekTimer = setTimeout(function(){ peekSpace(code); }, 420);
}
async function peekSpace(code){
  try {
    var res = await cloud.database.rpc('space_peek', { code: code });
    var d = res && res.data;
    if (!d) return;
    var el = $('pair-peek');
    if (Number(d.count) > 0) {
      el.className = 'peek ok';
      el.innerHTML = '找到这个空间了 — 已有 <b>' + d.count + '</b> 人：<b>' + esc((d.names||[]).join('、')) + '</b><br>是这一组的话，继续填下面的信息就行。';
    } else {
      el.className = 'peek new';
      el.innerHTML = '这个口令还没人用过。如果你想新建一个空间，请改选上面的「创建我们的空间」。';
    }
    el.classList.remove('hidden');
  } catch(e){ /* 探测失败不影响创建 */ }
}
async function doPair(){
  var nick = ($('pair-nick').value||'').trim();
  var start = Number($('pair-start').value);
  var target = Number($('pair-target').value);
  var space = ($('pair-space').value||'').trim().toUpperCase();
  var err = $('pair-err');
  var isJoin = (pairMode === 'join');
  if (!nick) { err.textContent = '填一下你的昵称'; return; }
  if (!start || start < 20 || start > 400) { err.textContent = '填一下现在的体重'; return; }
  if (!target || target < 20 || target > 400) { err.textContent = '填一下想减到多少'; return; }
  if (target >= start) { err.textContent = '目标要比现在的体重要小才行'; return; }
  if (!space) { err.textContent = isJoin ? '填一下对方给你的口令' : '口令没生成，点「换一个」重试'; return; }
  if (!/^[A-Z0-9-]{6,20}$/.test(space)) { err.textContent = '口令格式不对，检查一下'; return; }
  if (S.myProfiles.some(function(p){ return p.space_id === space; })) {
    err.textContent = '你已经在这个空间里了，不用重复加入';
    return;
  }
  var btn = $('btn-pair'); btn.disabled = true; btn.textContent = '处理中…';
  try {
    unwrap(await cloud.database.from('profiles').insert({
      owner_name: nick, space_id: space, nickname: nick, role: 'her',
      start_weight: start, target_weight: target
    }).select());
    // 先把当前空间切到新的这个，后面 loadAll 才会取到它
    setCurSpace(space);
    // 小目标和标签是整个空间共用的，只在空间里还没有的时候铺一遍默认值，
    // 否则每个新加入的人都会把同一套再加一次，界面就变成一堆重复项。
    var hasTodos = false, hasTags = false;
    try {
      hasTodos = (unwrap(await cloud.database.from('todos').select('*')) || []).some(function(x){ return x.space_id === space; });
      hasTags  = (unwrap(await cloud.database.from('tags').select('*'))  || []).some(function(x){ return x.space_id === space; });
    } catch(e){}
    if (!hasTodos) {
      var defaultTodos = ['喝水 2L','晚上不吃主食','一起走 8000 步'];
      for (var i=0;i<defaultTodos.length;i++){
        try { await cloud.database.from('todos').insert({ owner_name:nick, space_id:space, text:defaultTodos[i], sort:(i+1)*10 }); } catch(e){}
      }
    }
    if (!hasTags) {
      var defaultTags = ['跑步 30 分钟','喝水 2L','力量训练','没吃夜宵','步数 1w+','戒奶茶'];
      for (var j=0;j<defaultTags.length;j++){
        try { await cloud.database.from('tags').insert({ owner_name:nick, space_id:space, text:defaultTags[j], sort:(j+1)*10 }); } catch(e){}
      }
    }
    await loadAll();
    // 最先建空间的是暖橘(her)，之后加入的自动转雾蓝(him)：只影响旧版缓存里的配色
    if (!pairAdd && S.profiles.length > 1 && S.profiles[0].owner_id !== uid) {
      try {
        unwrap(await cloud.database.from('profiles').update({ role:'him' }).eq('id', S.profile.id).select());
        await loadAll();
      } catch(e){}
    }
    btn.disabled = false; btn.textContent = pairBtnLabel();
    try { if (location.search) history.replaceState(null, '', location.pathname); } catch(e){}
    show('app'); renderAll(); switchTab('home');
    if (pairAdd) toast('已加入「' + spaceLabel(S.space, S.profiles) + '」');
    else if (S.others.length) toast('已和 ' + S.others[0].nickname + ' 连上啦');
    else toast('空间建好了，把口令发给对方吧');
  } catch(e){
    btn.disabled = false; btn.textContent = pairBtnLabel();
    err.textContent = '没成功：' + (e && e.message || '请重试');
  }
}

/* ---------- 邀请 ---------- */
function inviteUrl(){
  return location.origin + location.pathname + '?space=' + encodeURIComponent(S.profile.space_id);
}
function copyText(t, okMsg){
  var done = function(){ toast(okMsg || '链接已复制'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t); done(); });
  } else { fallbackCopy(t); done(); }
}
function fallbackCopy(t){
  var ta = document.createElement('textarea'); ta.value = t;
  ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}
function shareInvite(){
  var url = inviteUrl(), code = S.profile.space_id;
  if (navigator.share) {
    navigator.share({ title:'减脂搭子', text:'一起减脂打卡 — 口令 '+code, url:url })
      .catch(function(){ copyText(code, '口令已复制：' + code); });
  } else {
    copyText(code, '口令已复制：' + code);
  }
}

/* ---------- tab ---------- */
function switchTab(name){
  currentTab = name;
  ['home','record','trend','us'].forEach(function(t){
    $('page-'+t).classList.toggle('hidden', t !== name);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(el){
    el.classList.toggle('active', el.getAttribute('data-tab') === name);
  });
  if (name === 'record') { S.draft = { weight:null, tags:[], todoDone:[], mood:null, note:'' }; renderRecord(); }
  if (name === 'home') renderHome();
  if (name === 'trend') renderTrend();
  if (name === 'us') renderUs();
  var main = $('page-'+name); if (main) main.scrollTop = 0;
}
function renderAll(){
  renderHome(); renderTrend(); renderUs();
  if (currentTab === 'record') renderRecord();
}

/* ---------- 绑定 & 启动 ---------- */
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(el){
  el.onclick = function(){ switchTab(el.getAttribute('data-tab')); };
});
$('btn-send-code').onclick = sendCode;
$('btn-send-email').onclick = sendCode;
$('btn-login').onclick = doLogin;
$('btn-switch-method').onclick = function(){ setLoginMode(loginMode === 'phone' ? 'email' : 'phone'); };
$('phone').oninput = function(){ $('phone-err').classList.add('hidden'); };
$('email').oninput = function(){ $('email-err').classList.add('hidden'); };
$('btn-new-code').onclick = function(){ $('pair-space').value = makeCode(); $('pair-peek').classList.add('hidden'); };
$('pair-space').oninput = onSpaceInput;
Array.prototype.forEach.call(document.querySelectorAll('#pair-seg .seg-btn'), function(b){
  b.onclick = function(){ setPairMode(b.getAttribute('data-mode')); };
});
$('btn-pair').onclick = doPair;
$('btn-pair-back').onclick = function(){
  S.draft = { weight:null, tags:[], todoDone:[], mood:null, note:'' };
  if (S.profile) { show('app'); renderAll(); } else { show('view-login'); }
};
$('btn-settings').onclick = openSettings;

(async function boot(){
  tickClock();
  setLoginMode('email');
  try {
    initCloud();
    var sess = await cloud.auth.getSession();
    if (sess && sess.data && sess.data.user) { await afterLogin(); }
    else { show('view-login'); }
  } catch(e){
    show('view-login');
    $('login-err').textContent = '连接失败：' + (e && e.message || '请检查网络后重试');
  }
})();

/* ---------- 安装到桌面（iOS 主屏幕 Web App / PWA） ---------- */
var installEvt = null;
function isStandalone(){
  try {
    if (window.navigator.standalone === true) return true;
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) return true;
  } catch(e){}
  return false;
}
function clientPlatform(){
  var ua = navigator.userAgent || '';
  if (/MicroMessenger/i.test(ua)) return 'wechat';
  if (/QQ\//i.test(ua)) return 'qq';
  if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Android/i.test(ua)) return 'android';
  return 'desktop';
}
function installSteps(){
  var p = clientPlatform();
  if (p === 'ios') {
    return '在 <b>Safari</b> 里三步就能装到桌面：'
      + '<ul class="it-steps">'
      + '<li>点屏幕底部中间的「分享」按钮（方框带向上箭头）</li>'
      + '<li>菜单里往下滑，选「<b>添加到主屏幕</b>」</li>'
      + '<li>右上角点「添加」，回桌面点新图标打开</li>'
      + '</ul>'
      + '<div style="margin-top:9px">装好后是<b>全屏、无地址栏</b>，和 App 一样。<br><b>请从桌面图标登录</b>：Safari 和桌面图标的登录状态是分开的，先在 Safari 登了还得再登一次。</div>';
  }
  if (p === 'wechat' || p === 'qq') {
    return '现在是在微信/QQ 里打开的，<b>这里装不了</b>。先这样：'
      + '<ul class="it-steps">'
      + '<li>点右上角「···」</li>'
      + '<li>选「<b>在浏览器中打开</b>」</li>'
      + '<li>进浏览器后，再按提示添加到主屏幕</li>'
      + '</ul>';
  }
  if (p === 'android') {
    return '在 Chrome 里：'
      + '<ul class="it-steps">'
      + '<li>点右上角「⋮」</li>'
      + '<li>选「<b>安装应用</b>」或「添加到主屏幕」</li>'
      + '<li>确认「安装」</li>'
      + '</ul>';
  }
  return '在 Chrome / Edge 里：点地址栏右侧的<b>安装图标</b>，或打开右上角菜单选「<b>安装 减脂搭子</b>」。';
}
function refreshInstallTip(){
  var tip = $('install-tip');
  if (!tip) return;
  if (isStandalone() || localStorage.getItem('install_tip_off') === '1') { tip.style.display = 'none'; return; }
  $('install-tip-body').innerHTML = installSteps();
  var b = $('btn-install-now');
  if (b) b.textContent = installEvt ? '一键安装' : '怎么装？';
  tip.style.display = 'block';
}
function hideSheetHard(){
  var m = $('sheet-mask'), sh = $('sheet');
  if (m) m.classList.add('hidden');
  if (sh) sh.classList.remove('show');
}
function openInstallSheet(){
  var p = clientPlatform();
  var title = p === 'desktop' ? '装到电脑桌面' : (p === 'ios' ? '装到 iPhone 桌面' : '装到手机桌面');
  openSheet(title, '<div class="it-body">' + installSteps() + '</div>'
    + '<button class="btn sm" id="btn-guide-ok" style="margin-top:14px">知道了</button>');
  var ok = $('btn-guide-ok');
  if (ok) ok.onclick = hideSheetHard;
}
async function doInstall(){
  if (installEvt) {
    try {
      installEvt.prompt();
      var r = await installEvt.userChoice;
      installEvt = null;
      if (r && r.outcome === 'accepted') { toast('装好了，回桌面点图标打开'); return; }
    } catch(e){}
  }
  openInstallSheet();
}
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  installEvt = e;
  refreshInstallTip();
});
window.addEventListener('appinstalled', function(){
  try { localStorage.setItem('install_tip_off', '1'); } catch(e){}
  refreshInstallTip();
  toast('安装完成');
});
$('btn-install-now').onclick = doInstall;
$('btn-install-later').onclick = function(){
  try { localStorage.setItem('install_tip_off', '1'); } catch(e){}
  refreshInstallTip();
};
refreshInstallTip();

/* ---------- service worker ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
