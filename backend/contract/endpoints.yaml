    risk: 需频控与返回内容约束（见 docs/07 R6；分析仅存私有归档）

business_invariants:
  - space_id 是多组隔离的唯一键，任何读写都必须带它
  - 一人一天一空间一条 record
  - 前端不写 owner_id
  - 删除 todos/tags 不校验 owner（同组可删）
  - rewards 允许同组跨用户更新
  - 常量: 体重范围 20-400kg；todos 文本 <=40 字；tags <=20 字；prize <=30 字
  - 默认小目标: [喝水 2L, 晚上不吃主食, 一起走 8000 步]
  - 默认标签: [跑步 30 分钟, 喝水 2L, 力量训练, 没吃夜宵, 步数 1w+, 戒奶茶]
