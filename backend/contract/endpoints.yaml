envelope:
  success: "{ data: <any>, error: null }"
  failure: "{ data: null, error: { message: <string> } }"
  client_unwrap: throws when error is present
  notes:
    - 前端只消费 error.message，不依赖错误码
    - 写入后续接 .select() 必须回读整行

server_injected:
  owner_id: 由服务端用当前 session 用户 id 注入，客户端传入应被忽略

query_builder:
  select: ["*"]
  order: single column, ascending, chainable twice
  eq: single condition
  insert: single object
  update: partial object
  delete: requires eq
  unsupported: [or, in, like, range, join, rpc_other_than_space_peek]

