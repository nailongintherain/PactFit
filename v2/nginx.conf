server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header Cache-Control "no-store" always;
 add_header Referrer-Policy "no-referrer" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:19999 http://127.0.0.1:13000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
 location /v2/ { alias /usr/share/nginx/html/; index index.html; }
 location / { try_files $uri $uri/ =404; }
}
