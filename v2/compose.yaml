name: pactfit-v2-preview
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate with scripts/v2-up.sh}
      POSTGRES_DB: pactfit_v2
    volumes:
      - v2pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d pactfit_v2']
      interval: 2s
      retries: 40
  gotrue:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:${GOTRUE_DB_PASSWORD}@db:5432/pactfit_v2?search_path=auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SITE_URL: http://127.0.0.1:18899/v2/
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:18899/v2/,http://localhost:18899/v2/
      API_EXTERNAL_URL: http://127.0.0.1:19999
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: preview@pactfit.local
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_VERIFICATION: /verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '1000'
    ports: ['127.0.0.1:19999:9999']
  postgrest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/pactfit_v2
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_HOST: 0.0.0.0
    ports: ['127.0.0.1:13000:3000']
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports: ['127.0.0.1:18025:8025']
  web:
    image: nginx:alpine
    ports: ['127.0.0.1:18899:80']
    volumes:
      - ../web/v2:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  v2pg:
