name: pactfit-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置（见 .env.example）}
      POSTGRES_DB: ${POSTGRES_DB:-pactfit_dev}
    volumes:
      - pactfit_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-pactfit_dev}"]
      interval: 3s
      timeout: 3s
      retries: 20

  gotrue:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:${GOTRUE_DB_PASSWORD:?GOTRUE_DB_PASSWORD 必须设置}@db:5432/${POSTGRES_DB:-pactfit_dev}?search_path=auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置}
      GOTRUE_JWT_AUD: ${JWT_AUD:-pactfit-local}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SITE_URL: ${SITE_URL:-http://127.0.0.1:8899}
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://127.0.0.1:9999}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@pactfit.local}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_ADMIN_EMAIL:-admin@pactfit.local}
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_URLPATHS_VERIFICATION: /verify
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      GOTRUE_LOG_LEVEL: info
    ports:
      - "127.0.0.1:${GOTRUE_PORT:-9999}:9999"

  postgrest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?AUTHENTICATOR_PASSWORD 必须设置}@db:5432/${POSTGRES_DB:-pactfit_dev}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置}
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000
    ports:
      - "127.0.0.1:${POSTGREST_PORT:-3000}:3000"

  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"   # Web / API（SMTP 1025 仅容器网内）

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8899}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro

volumes:
  pactfit_pgdata:
